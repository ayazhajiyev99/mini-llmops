name: Mini LLMOps CI

# Workflow nə vaxt işləsin?
on:

  # GitHub-a push ediləndə
  push:

  # Pull Request açılanda
  pull_request:


# Görüləcək işlər
jobs:

  test:

    # GitHub bizə müvəqqəti Ubuntu kompüteri verir
    runs-on: ubuntu-latest

    # Test üçün saxta API key
    # Real API key BURADA yazılmır!
    env:
      OPENAI_API_KEY: test-key

    steps:

      # 1. GitHub repository-dəki kodu götürür
      - name: Repository-ni yüklə
        uses: actions/checkout@v4


      # 2. Python quraşdırır
      - name: Python quraşdır
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # 3. Kitabxanaları quraşdırır
      - name: Dependencies quraşdır
        run: pip install -r requirements.txt


      # 4. Testləri işə salır
      - name: Testləri işə sal
        run: python -m pytest -q